<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>THE WED MANSION — Luxury Wedding Photography</title>
  <meta name="description" content="THE WED MANSION. Luxury editorial wedding photography & cinematic films. Kerala | Chennai | Bengaluru | Hyderabad.">
  <meta name="keywords" content="The Wed Mansion, wedding photography, luxury wedding photography, wedding films, Kerala, Chennai, Bengaluru, Hyderabad">
  
  <!-- Open Graph -->
  <meta property="og:title" content="THE WED MANSION — Luxury Wedding Photography">
  <meta property="og:description" content="Minimal editorial wedding cinema & photography experience.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/hero_frames/frame_119.webp">

  <!-- Google Fonts: Italiana (Luxury Serif), Cinzel, and Plus Jakarta Sans (Clean Minimalist Geometric Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Italiana&family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="luxury-body">

  <!-- ========================================================= -->
  <!-- MAIN CINEMATIC CONTAINER (FULLSCREEN VIEWPORT) -->
  <!-- ========================================================= -->
  <div id="cinematic-app" class="cinematic-app" aria-label="The Wed Mansion Cinematic Experience">

    <!-- ========================================================= -->
    <!-- SECTION 01: SCROLL-DRIVEN CINEMATIC HANDS & TYPOGRAPHY -->
    <!-- ========================================================= -->
    <section id="section-cinema" class="view-section active" aria-label="Cinematic Film Opening">
      
      <!-- Top Center Logo for Section 1 -->
      <div class="s1-header-center" id="s1-header" aria-hidden="true">
        <img src="assets/twm_monogram_retina.png" alt="TWM" class="header-twm-logo">
      </div>

      <!-- High-Performance Canvas for 60FPS Scroll Seeking -->
      <div class="canvas-wrapper">
        <canvas id="hero-canvas" width="1920" height="1080" aria-label="Cinematic wedding hands ring exchange animation"></canvas>
      </div>

      <!-- Typography Overlays for 4 Progressive States -->
      <div class="hero-typography-layer" aria-live="polite">
        
        <!-- State 1: THE (Center) -->
        <div class="text-stage" id="stage-the" data-stage="1">
          <h1 class="stage-word">THE</h1>
        </div>

        <!-- State 2: WED (Center) -->
        <div class="text-stage" id="stage-wed" data-stage="2">
          <h1 class="stage-word">WED</h1>
        </div>

        <!-- State 3: MANSION (Center) -->
        <div class="text-stage" id="stage-mansion" data-stage="3">
          <h1 class="stage-word">MANSION</h1>
        </div>

        <!-- State 4: WEDDING PHOTOGRAPHY & VIDEOGRAPHY (Bottom Center) -->
        <div class="text-stage stage-bottom" id="stage-photography" data-stage="4">
          <h2 class="stage-phrase">WEDDING PHOTOGRAPHY & VIDEOGRAPHY</h2>
        </div>

      </div>

      <!-- Subtle Scroll Cue -->
      <div class="scroll-cue" id="scroll-cue" aria-hidden="true">
        <div class="scroll-cue-line"></div>
      </div>

    </section>

    <!-- ========================================================= -->
    <!-- SECTION 02: LAUNCHING SOON WITH LARGE TWM LOGO -->
    <!-- ========================================================= -->
    <section id="section-launching" class="view-section section-launching" aria-label="Launching Soon">
      
      <!-- Center Editorial Content with Large TWM Monogram -->
      <div class="launching-center-content">
        <img src="assets/twm_monogram_retina.png" alt="TWM Logo" class="launching-twm-monogram-img">
        <h2 class="launching-title">LAUNCHING SOON</h2>
        <p class="launching-subtitle">STAY TUNED</p>
      </div>

      <!-- Bottom City Locations -->
      <div class="launching-bottom-locations">
        <p class="locations-list">KERALA &nbsp;|&nbsp; CHENNAI &nbsp;|&nbsp; BENGALURU &nbsp;|&nbsp; HYDERABAD</p>
      </div>

    </section>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
